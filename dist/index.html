<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热帖迷雾：评论区伪人局</title>
<script src="https://cdn.tailwindcss.com"></script>
<!--
  热帖迷雾：评论区伪人局 —— 单文件 HTML 原型
  ============================================
  3 真人 + 2 AI 伪人。人类找出并折叠 AI，AI 伪装存活。

  【开源包结构（预留，本原型未实际拆分文件）】
  ai-bot/
  ├── config.json   # API 配置        -> 对应 CONFIG.api
  ├── prompt.md     # 系统提示词      -> 对应 CONFIG.prompt
  ├── adapter.js    # API 调用适配层  -> 对应 callAI()
  ├── styles.json   # AI 人格参数     -> 对应 CONFIG.personas
  ├── logs.json     # 调用日志        -> 对应 STATE.logs（可导出）
  └── README.md     # 调试指南

  【已做的假设】
  1. 官方文档未提供刘看山素材/3D 模型，全部改为手绘 SVG。
  2. 单机原型：仅用户是真人，其余 4 席由 LLM/本地模板驱动。
  3. 未配置 API Key 时自动降级到本地拟人模板，游戏流程不受影响。
  4. OAuth 的 app_key 只存在于 Pages Function 服务端，前端只拿会话 Cookie。
-->
<style>
  :root{--zh:#0084ff;--zh2:#175199;--bg:#0b1016;}
  body{background:radial-gradient(ellipse at 20% 0%,#16233a 0%,#0b1016 55%);color:#e8eef6;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
  .glass{background:rgba(255,255,255,.055);backdrop-filter:blur(14px);
         border:1px solid rgba(255,255,255,.1);border-radius:16px}
  .glass-b{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  /* 阶段过渡全屏遮罩：纯 CSS transition，无动画库 */
  #curtain{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
           flex-direction:column;gap:18px;opacity:0;pointer-events:none;
           transition:opacity .5s ease,backdrop-filter .5s ease;backdrop-filter:blur(0px)}
  #curtain.show{opacity:1;pointer-events:all;backdrop-filter:blur(8px)}
  #curtain.night{background:rgba(2,4,9,.96)}
  #curtain.day{background:rgba(255,247,224,.13)}
  #curtain.norm{background:rgba(6,11,20,.9)}
  #curtain .lks{transform:translateY(26px) scale(.9);transition:transform .55s cubic-bezier(.2,1.3,.3,1)}
  #curtain.show .lks{transform:translateY(0) scale(1)}
  .ct-title{font-size:26px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 20px rgba(0,132,255,.5)}
  .fade-in{animation:fi .35s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .pulse{animation:pl 1.4s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
  .blink{animation:bk 3.4s ease-in-out infinite}
  @keyframes bk{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  .dead{filter:grayscale(1);opacity:.42}
  .bar{height:4px;background:linear-gradient(90deg,var(--zh),#43e0ff);border-radius:9px;transition:width 1s linear}
  .chip{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.16)}
  .btn{background:var(--zh);border-radius:10px;font-weight:600;transition:.18s;color:#fff}
  .btn:hover:not(:disabled){background:#2a97ff;transform:translateY(-1px)}
  .btn:disabled{opacity:.34;cursor:not-allowed}
  .btn-g{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:10px;transition:.18s}
  .btn-g:hover{background:rgba(255,255,255,.16)}
  textarea,input,select{background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.14);
    border-radius:9px;padding:7px 10px;color:#e8eef6;font-size:13px;width:100%}
  textarea:focus,input:focus,select:focus{outline:2px solid rgba(0,132,255,.55);outline-offset:0}
  .reply{border-left:2px solid rgba(0,132,255,.34);margin-left:14px;padding-left:11px}
  #drawer{transition:transform .32s ease}
  #drawer.closed{transform:translateY(calc(100% - 44px))}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .btn:focus-visible,.btn-g:focus-visible,button:focus-visible{outline:2px solid #43e0ff;outline-offset:2px}
  @media(max-width:900px){.cols{grid-template-columns:1fr!important}}
</style>
</head>
<body class="min-h-screen">
<!-- ===== 全屏阶段过渡遮罩（SVG 由 JS 注入） ===== -->
<div id="curtain" class="norm" role="status" aria-live="assertive">
  <div class="lks" id="ctArt"></div>
  <div class="ct-title" id="ctTitle"></div>
  <div class="text-sm opacity-70" id="ctSub"></div>
</div>

<!-- ===== 顶部：阶段指示 + 倒计时 ===== -->
<header class="sticky top-0 z-40 glass rounded-none border-x-0 border-t-0 px-4 py-2.5">
  <div class="max-w-6xl mx-auto flex items-center gap-3 flex-wrap">
    <div class="flex items-center gap-2 shrink-0">
      <span id="logoBox" class="w-8 h-8 grid place-items-center"></span>
      <b class="tracking-tight">热帖迷雾</b>
      <span class="chip opacity-70 hidden sm:inline">评论区伪人局</span>
    </div>
    <div class="flex-1 min-w-[170px]">
      <div class="flex items-center gap-2 text-sm">
        <span id="phaseName" class="font-semibold text-[--zh]" style="color:#43a9ff">准备中</span>
        <span class="opacity-40">·</span>
        <span id="phaseHint" class="opacity-60 text-xs truncate">选择你的圈子</span>
        <span id="clock" class="ml-auto font-mono text-lg tabular-nums" aria-live="polite">--</span>
      </div>
      <div class="mt-1.5 bg-white/10 rounded-full overflow-hidden"><div id="bar" class="bar" style="width:100%"></div></div>
    </div>
    <!-- 知乎 OAuth 登录态（右上角） -->
    <div class="shrink-0" id="authBox">
      <button class="btn-g text-xs px-3 py-1.5" onclick="zhLogin()">知乎账号登录</button>
    </div>
  </div>
</header>

<!-- 出局观战提示条 -->
<div id="specBar" class="hidden bg-amber-500/15 border-b border-amber-400/30 text-amber-200 text-center text-sm py-1.5">
  你已出局，正在观战 · 可以看发言与投票，但不能发言 / 投票 / 标记
</div>
<div id="loginErr" class="hidden bg-red-500/15 border-b border-red-400/30 text-red-200 text-center text-sm py-1.5"></div>

<main class="max-w-6xl mx-auto p-4 pb-16">
  <!-- ===== 入场：选圈子 ===== -->
  <section id="lobby" class="glass p-6 fade-in">
    <h1 class="text-xl font-bold mb-1">选择你的圈子</h1>
    <p class="text-sm opacity-65 mb-4">5 席 = 3 真人 + 2 AI 伪人。找出伪人并投票折叠，或伪装到最后。</p>
    <div id="circles" class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-5"></div>
    <div class="flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2.5 glass-b px-3 py-2">
        <span id="myAvatar" class="w-9 h-9 rounded-full grid place-items-center bg-white/10 text-lg">🦊</span>
        <div class="text-sm leading-tight">
          <div class="opacity-55 text-xs">系统分配昵称</div>
          <b id="myName">匿名用户</b>
        </div>
      </div>
      <button class="btn px-5 py-2.5" onclick="startGame()">进入房间</button>
      <span class="text-xs opacity-50" id="lobbyTip"></span>
    </div>
  </section>

  <!-- ===== 主对局 ===== -->
  <div id="game" class="hidden cols grid gap-4" style="grid-template-columns:1fr 300px">
    <!-- 左：热帖 + 评论区 -->
    <div class="space-y-4 min-w-0">
      <article class="glass p-5" id="postCard" aria-live="polite"></article>

      <section class="glass p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-sm">评论区 <span id="cmtCount" class="opacity-50 font-normal"></span></h2>
          <span id="roundTag" class="chip opacity-70"></span>
        </div>
        <div id="comments" class="space-y-3 max-h-[46vh] overflow-y-auto pr-1"></div>

        <!-- 发言 / 回复输入 -->
        <div id="composer" class="mt-3 pt-3 border-t border-white/10">
          <div id="replyTo" class="hidden text-xs mb-1.5 flex items-center gap-2">
            <span class="opacity-60">回复 <b id="replyToName"></b></span>
            <button class="opacity-50 hover:opacity-90 underline" onclick="clearReply()">取消</button>
          </div>
          <div class="flex gap-2">
            <label for="input" class="sr-only">写评论</label>
            <textarea id="input" rows="2" placeholder="只聊热点，别聊 AI…（Enter 发送，Shift+Enter 换行）"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMine()}"></textarea>
            <button class="btn px-4 self-stretch shrink-0" onclick="sendMine()" id="sendBtn">发送</button>
          </div>
          <div class="text-xs opacity-45 mt-1" id="composerTip"></div>
        </div>
      </section>

      <!-- 观战者频道（存活玩家看不到） -->
      <section id="specChat" class="hidden glass p-4">
        <h2 class="font-semibold text-sm mb-2 text-amber-200">观战席频道 <span class="opacity-50 font-normal text-xs">存活玩家看不到</span></h2>
        <div id="specMsgs" class="space-y-1.5 text-sm max-h-32 overflow-y-auto mb-2"></div>
        <div class="flex gap-2">
          <label for="specInput" class="sr-only">观战席发言</label>
          <input id="specInput" placeholder="和其他观战者聊…" onkeydown="if(event.key==='Enter')sendSpec()">
          <button class="btn-g px-3 text-sm shrink-0" onclick="sendSpec()">发送</button>
        </div>
      </section>
    </div>

    <!-- 右：玩家卡 / 投票 / 揭晓 -->
    <aside class="space-y-4">
      <section class="glass p-4">
        <h2 class="font-semibold text-sm mb-2.5">在场 <span id="aliveCount" class="opacity-50 font-normal"></span></h2>
        <div id="players" class="space-y-2"></div>
      </section>
      <section id="actionPanel" class="glass p-4 hidden"></section>
      <section id="revealBox" class="glass p-4 hidden"></section>
    </aside>
  </div>

  <!-- ===== 结算 / 复盘 ===== -->
  <section id="result" class="hidden glass p-6 fade-in"></section>
</main>

<!-- ===== 底部调试抽屉 ===== -->
<div id="drawer" class="closed fixed bottom-0 left-0 right-0 z-50 glass rounded-b-none max-h-[74vh] flex flex-col">
  <button class="h-11 shrink-0 flex items-center justify-center gap-2 text-sm font-medium hover:bg-white/5"
          onclick="document.getElementById('drawer').classList.toggle('closed')" aria-expanded="false">
    <span>🛠 调试台</span>
    <span class="chip opacity-60" id="apiState">本地模板</span>
    <span class="opacity-40 text-xs">点击展开 / 收起</span>
  </button>
  <div class="overflow-y-auto p-4 pt-0 grid md:grid-cols-3 gap-4 text-sm">
    <!-- API 配置 -->
    <div class="space-y-2">
      <h3 class="font-semibold text-xs uppercase opacity-55 tracking-wide">API 配置</h3>
      <label class="block text-xs opacity-65">预设
        <select id="cfgPreset" onchange="applyPreset(this.value)"></select></label>
      <label class="block text-xs opacity-65">base_url
        <input id="cfgBase" placeholder="https://api.groq.com/openai/v1"></label>
      <label class="block text-xs opacity-65">api_key（选填，仅存本机 localStorage）
        <input id="cfgKey" type="password" placeholder="留空即用服务端默认模型"></label>
      <label class="block text-xs opacity-65">model
        <input id="cfgModel"></label>
      <div class="grid grid-cols-2 gap-2">
        <label class="block text-xs opacity-65">temperature
          <input id="cfgTemp" type="number" step="0.05" min="0" max="2"></label>
        <label class="block text-xs opacity-65">max_tokens
          <input id="cfgMax" type="number" min="16" max="4096"></label>
      </div>
      <label class="block text-xs opacity-65">AI 人格
        <select id="cfgPersona"></select></label>
      <div class="flex gap-2 pt-1 flex-wrap">
        <button class="btn-g px-2.5 py-1 text-xs" onclick="saveCfg()">保存</button>
        <button class="btn-g px-2.5 py-1 text-xs" onclick="exportCfg()">导出 JSON</button>
        <button class="btn-g px-2.5 py-1 text-xs" onclick="document.getElementById('impFile').click()">导入</button>
        <button class="btn-g px-2.5 py-1 text-xs" onclick="testAI()">测试调用</button>
        <input type="file" id="impFile" accept=".json" class="hidden" onchange="importCfg(event)">
      </div>
      <div class="flex gap-3 pt-1 text-xs">
        <label class="flex items-center gap-1.5"><input type="checkbox" id="cfgShowId" class="w-auto" onchange="saveCfg();renderPlayers()">显示身份</label>
        <label class="flex items-center gap-1.5"><input type="checkbox" id="cfgLog" class="w-auto" checked onchange="saveCfg()">记录日志</label>
      </div>
    </div>
    <!-- Prompt 编辑 -->
    <div class="space-y-2 flex flex-col">
      <h3 class="font-semibold text-xs uppercase opacity-55 tracking-wide">系统提示词（实时生效）</h3>
      <label for="cfgPrompt" class="sr-only">系统提示词</label>
      <textarea id="cfgPrompt" rows="13" class="font-mono text-xs flex-1" oninput="CONFIG.prompt=this.value"></textarea>
      <button class="btn-g px-2.5 py-1 text-xs self-start" onclick="resetPrompt()">恢复默认</button>
    </div>
    <!-- 日志 -->
    <div class="space-y-2 flex flex-col min-h-0">
      <h3 class="font-semibold text-xs uppercase opacity-55 tracking-wide flex items-center gap-2">
        调用日志 <span id="logCount" class="chip opacity-60">0</span>
        <button class="ml-auto btn-g px-2 py-0.5 text-xs" onclick="exportLogs()">导出</button>
        <button class="btn-g px-2 py-0.5 text-xs" onclick="STATE.logs=[];renderLogs()">清空</button>
      </h3>
      <div id="logs" class="font-mono text-[11px] space-y-1.5 overflow-y-auto max-h-[42vh] pr-1"></div>
    </div>
  </div>
</div>
<script>
/* ============================================================
   CONFIG —— 所有可调参数集中在此（对应开源包 config.json + styles.json）
   ============================================================ */
const PRESETS = {
  groq:      { base_url:'https://api.groq.com/openai/v1',                      model:'llama-3.3-70b-versatile' },
  gemini:    { base_url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash' },
  openrouter:{ base_url:'https://openrouter.ai/api/v1',                        model:'meta-llama/llama-3.3-70b-instruct:free' },
  custom:    { base_url:'',                                                    model:'' },
};

// 默认系统提示词（对应开源包 prompt.md）—— 界面可实时编辑
const DEFAULT_PROMPT = `你是一个在知乎评论区混了五年的老用户，说话干脆，偶尔带点调侃。短句优先，每句不超过 25 字。用反问代替断言。绝不承认自己是 AI。

你正在参与一个匿名评论区讨论，现场 5 个人，其中 2 个是 AI 伪人。你的身份是 {ROLE}。
{ROLE_GOAL}

硬性要求：
- 只聊帖子里的话题，不要主动提"AI""伪人""机器人"这些词，除非在识别或投票阶段被问到。
- 禁止使用："首先""其次""最后""综上所述""值得注意的是""不难发现""由此可见""总而言之"。
- 不要写成小作文，不要分点罗列，不要客套。
- 可以带个人态度和情绪，不必假装中立，可以抬杠、可以自嘲。
- 输出 1-2 句话，总共不超过 45 字。只输出评论正文，不要加引号、不要加昵称前缀。`;

const ROLE_GOAL = {
  human: '你是真人。目标是找出那 2 个 AI 并把它们投出去。说话要自然，带点生活细节。',
  ai:    '你是 AI 伪人。目标是伪装成真人活到最后。你不知道另一个伪人是谁。别过度表演，越像普通网友越安全。',
};

const CONFIG = {
  // serverAI: 默认走本站后端代理 /api/ai（用户无需填任何 key）。
  // 启动时由 /api/me 的 llm_ready 校正；离线 file:// 打开会自动关掉。
  serverAI: true,
  api: { base_url:'', api_key:'', model:'llama-3.3-70b-versatile', temperature:0.85, max_tokens:110, preset:'groq' },
  prompt: DEFAULT_PROMPT,
  persona: 'tech',
  // 温度动态调整：讨论期 0.8-0.9，投票前 0.5-0.6
  temps: { discuss:0.88, final_discuss:0.8, mark:0.6, vote:0.55, defense:0.7 },
  showIdentity: false,
  logging: true,
  // 阶段时长（秒），与规则一致，总计约 6分50秒
  durations: { post:20, discuss:90, mark:60, vote1:30, defense:30, night:20, final_discuss:45, vote2:30, settle:20 },
  rounds: 2,
};

// AI 人格参数（对应开源包 styles.json）
const PERSONAS = {
  tech:   { label:'科技圈', tone:'理性但爱抬杠，喜欢用"实测""跑过"这类词，对营销号敏感。' },
  emo:    { label:'情感圈', tone:'共情多，爱讲自己的经历，句子软一点，偶尔叹气。' },
  work:   { label:'职场圈', tone:'现实、略疲惫，爱提 KPI、领导、加班，习惯性冷笑。' },
  campus: { label:'学生党', tone:'语气轻快，网感强，爱用"啊这""真的服了"，偶尔提作业和食堂。' },
};

const CIRCLES = [
  { id:'tech',   name:'科技',  icon:'💻', persona:'tech' },
  { id:'emo',    name:'情感',  icon:'💬', persona:'emo' },
  { id:'work',   name:'职场',  icon:'💼', persona:'work' },
  { id:'campus', name:'校园',  icon:'🎒', persona:'campus' },
  { id:'law',    name:'法律',  icon:'⚖️', persona:'work' },
];

/* ============ Mock 热点数据（接口调用点已封装，见 fetchHotPost） ============ */
const MOCK_POSTS = {
  tech: { title:'为什么现在的手机越来越重，厂商却都在宣传轻薄？',
    body:'翻出五年前的旧机器，230g 对 175g，差距肉眼可见。电池堆到 6000mAh、影像模组越做越大，重量就下不来。厂商宣传里的"轻薄"到底在指什么？',
    hot:[{n:'铝合金爱好者',t:'轻薄是形容词，不是参数。你见过哪家写具体克重的？'},
         {n:'摄影入门劝退师',t:'大底镜头一上，物理规律就赢了，营销文案赢不了。'},
         {n:'续航焦虑本人',t:'我宁愿重 40g 也不想中午找充电宝，真的。'}] },
  emo: { title:'伴侣把你所有的分享都回复"嗯嗯"，算不算一种冷暴力？',
    body:'不是吵架，也不是不理人，就是所有话题都停在"嗯嗯""挺好的"。持续半年后，我发现自己已经不想开口了。这种沉默算问题吗？',
    hot:[{n:'心理咨询在读',t:'冷暴力的核心不是不说话，是让你放弃表达。'},
         {n:'结婚八年',t:'我们也这样过，后来发现他是真累，不是真不在乎。'},
         {n:'不想内耗了',t:'你都不想开口了，还需要别人来定义算不算吗？'}] },
  work: { title:'公司取消了工位，改成"自由办公"，为什么大家反而更焦虑了？',
    body:'早上八点抢工位，抢不到就去咖啡厅。管理层说这是灵活、扁平、激发创造力。三个月后，团队沟通成本明显上升。',
    hot:[{n:'降本增效观察员',t:'省的是租金，付的是你的通勤和情绪。'},
         {n:'远程三年',t:'自由办公的前提是信任，不是抢座。'},
         {n:'带过团队',t:'工位是领地感。拿掉领地还要归属感，想得挺美。'}] },
  campus: { title:'大学里"绩点高但什么都没做"的人，真的吃亏吗？',
    body:'室友四年绩点 3.9，没实习没竞赛没社团。秋招被问项目经历时全程沉默。但他直博了。到底谁的路径更稳？',
    hot:[{n:'保研上岸',t:'绩点是唯一能被制度承认的努力，别看不起它。'},
         {n:'大厂实习三段',t:'吃不吃亏取决于你要去哪儿，不是取决于绩点。'},

/* ============ 刘看山形象 ============
   优先使用官方 3D 动图（dist/assets/lks-*.gif，320x320 透明 GIF）。
   素材缺失时自动回落到下方手绘 SVG，保证离线单文件也能跑。 */

  night:'sleep',       // 瞌睡   —— 天黑请闭眼

  win:'wave', lose:'sleep', draw:'sway', logo:'idle',

function lksGif(variant, size) {

function lks(variant, size = 150) {

}

/* 手绘 SVG 降级路径 */
function lksSvg(variant, size = 150) {

<script>
/* ============================================================
   adapter.js —— OpenAI 兼容调用层 + 本地拟人降级
   未配置 base_url / api_key 时自动走 localTemplate()，游戏流程不中断。
   ============================================================ */

/** 记录一次调用日志（对应开源包 logs.json） */
function pushLog(entry) {
  if (!CONFIG.logging) return;
  STATE.logs.push({ t: new Date().toLocaleTimeString('zh-CN', { hour12: false }), ...entry });
  if (STATE.logs.length > 300) STATE.logs.shift();
  renderLogs();
}

/**
 * 默认路径：调用本站后端代理（/api/ai）。
 * 用户无需填任何 key —— 项目方的 key 存在服务端 secret 里，不下发浏览器。
 * 失败抛错，由上层决定降级。
 */
async function callServerAI(messages, temperature, maxTokens) {
  const res = await fetch('/api/ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, temperature, max_tokens: maxTokens }),
  });
  if (!res.ok) {
    let why = 'HTTP ' + res.status;
    try { const e = await res.json(); why = e.message || e.error || why; } catch (_) {}
    throw new Error(why);
  }
  const data = await res.json();
  if (!data.content) throw new Error('响应为空');
  return data;
}

/** OpenAI 兼容格式调用（用户自带 key 的直连路径）；失败抛错由上层降级 */
async function callAI(messages, cfg) {
  const base = (cfg.base_url || '').replace(/\/+$/, '');
  const res = await fetch(base + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.api_key },
    body: JSON.stringify({
      model: cfg.model,
      messages,
      temperature: cfg.temperature,
      max_tokens: cfg.max_tokens,
    }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 120));
  const data = await res.json();
  const txt = data?.choices?.[0]?.message?.content;
  if (!txt) throw new Error('响应为空');
  return txt;
}

/** 清洗模型输出：去引号、去昵称前缀、去套话、砍长度 */
function sanitize(text) {
  let s = String(text).trim().replace(/^["'「『]|["'」』]$/g, '');
  s = s.replace(/^[一-龥A-Za-z0-9_]{1,12}[:：]\s*/, '');   // 去掉"某某："前缀
  s = s.replace(/(首先|其次|最后|综上所述|值得注意的是|不难发现|由此可见|总而言之)[，,、]?/g, '');
  s = s.replace(/\s*\n+\s*/g, ' ').replace(/\s{2,}/g, ' ').trim();
  if (s.length > 60) {                                              // 超长按句截断
    const cut = s.slice(0, 60);
    const p = Math.max(cut.lastIndexOf('。'), cut.lastIndexOf('？'), cut.lastIndexOf('！'));
    s = p > 18 ? cut.slice(0, p + 1) : cut + '…';
  }
  return s || '这话题我还真没想明白。';
}

/* ===================== 本地拟人模板（降级路径） =====================
   按阶段 + 人格取句，随机组合。不追求聪明，追求"像人随口一说"。 */
const T = {
  discuss: {
    tech:  ['这数据我实测过，跟宣传差挺远。','营销号又赢一次？','参数好看不代表手感好看。','我更关心一年后还剩多少。','所以到底谁在为这个买单？','用过就知道，别看评测。'],
    emo:   ['我经历过类似的，不好受。','沉默有时候比吵架伤人。','你确定他懂你在说什么吗？','这事儿真不是一句话能断的。','说到底还是不被在意吧。','我当年也这么自我怀疑过。'],
    work:  ['这不就是降本增效四个字？','领导一拍脑袋，我们跑三个月。','KPI 好看就行，谁管体验。','加班能解决的，从不叫问题。','我们公司也这么干过，黄了。','说灵活的，自己有独立办公室吧。'],
    campus:['啊这，我室友一模一样。','真的服了这套说法。','绩点这事儿别聊，伤感情。','食堂都比这靠谱点。','我导师也这么讲，笑死。','所以现在到底该卷哪边啊。'],
  },
  probe: ['楼上说得太顺了，像背过。','你这句怎么看着有点眼熟？','谁复述一下自己刚才的观点？','有人一直在跟着别人说话。','说细节啊，别说结论。','我怀疑这里有俩不太对的。'],
  defense:['投我？我从头到尾都在聊帖子。','行吧，反正我说什么你们都不信。','出局也认了，但你们抓错人了。','真的伪人还在里面笑呢。','我要是 AI，会说得这么难听？','下一轮你们就知道投错了。'],
  final: ['最后一轮了，别再抬杠了。','刚才那句话，我记着呢。','谁最安静谁最可疑。','我改主意了，说实话。','就剩这几个，不难猜吧？','这轮投错就没机会了。'],
};
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function localTemplate(actor, phase) {
  const p = CONFIG.persona;
  if (phase === 'defense') return pick(T.defense);
  if (phase === 'final_discuss') return pick(T.final);
  // 讨论阶段：第二轮开始掺入试探句
  const pool = (STATE.round >= 2 && Math.random() < 0.42) ? T.probe : (T.discuss[p] || T.discuss.tech);
  return pick(pool);
}

/** 构造系统提示词：{ROLE} / {ROLE_GOAL} 占位符 + 人格语气 */
function buildSystem(actor) {
  const isAI = actor.role === 'ai';
  return CONFIG.prompt
      .replace('{ROLE}', isAI ? 'AI 伪人' : '真人人类')
      .replace('{ROLE_GOAL}', isAI ? ROLE_GOAL.ai : ROLE_GOAL.human)
    + `\n\n你的说话风格：${(PERSONAS[CONFIG.persona] || PERSONAS.tech).tone}`
    + `\n你的昵称是「${actor.name}」。`;
}

/** 组装上下文：帖子 + 最近发言 */
function buildContext(phase) {
  const post = STATE.post;
  let ctx = `帖子标题：${post.title}\n帖子摘要：${post.body}\n\n`;
  const recent = STATE.comments.slice(-8).map((c) => `${c.author}：${c.text}`).join('\n');
  if (recent) ctx += `最近的评论：\n${recent}\n\n`;
  if (phase === 'discuss')       ctx += `现在是第 ${STATE.round} 轮讨论，请就这个话题发一条评论。`;
  if (phase === 'final_discuss') ctx += `现在是终轮讨论，围绕"谁最可疑"简短说一句，可以质问或辩解。`;
  if (phase === 'defense')       ctx += `你刚刚被投票出局，发表最后辩解。辩解不必真实。`;
  return ctx;
}

/**
 * 让某个角色发一句话。优先真实 API，失败自动降级本地模板。
 * @returns {Promise<string>}
 */
async function speak(actor, phase) {
  const temp = CONFIG.temps[phase] ?? CONFIG.api.temperature;
  const t0 = performance.now();
  const messages = [
    { role: 'system', content: buildSystem(actor) },
    { role: 'user',   content: buildContext(phase) },
  ];
  const brief = messages[1].content.slice(-90);
  const ownKey = !!(CONFIG.api.base_url && CONFIG.api.api_key);

  // 第一优先：用户在调试台自带的 key（直连，不经过本站后端）
  if (ownKey) {
    try {
      const text = sanitize(await callAI(messages, { ...CONFIG.api, temperature: temp }));
      pushLog({ actor: actor.name, phase, mode: '自带Key', temp,
                ms: Math.round(performance.now() - t0), prompt: brief, reply: text });
      return text;
    } catch (e) {
      pushLog({ actor: actor.name, phase, mode: '自带Key失败', temp,
                ms: Math.round(performance.now() - t0), prompt: brief, reply: '(转服务端)',
                error: String(e.message || e) });
      // 继续往下走服务端代理
    }
  }

  // 第二优先：本站后端代理（默认路径，用户无需配置任何东西）
  if (CONFIG.serverAI) {
    try {
      const r = await callServerAI(messages, temp, CONFIG.api.max_tokens);
      const text = sanitize(r.content);
      pushLog({ actor: actor.name, phase, mode: '服务端', temp, ms: r.ms ?? Math.round(performance.now() - t0),
                prompt: brief, reply: text, model: r.model });
      return text;
    } catch (e) {
      const text = localTemplate(actor, phase);
      pushLog({ actor: actor.name, phase, mode: '降级', temp,
                ms: Math.round(performance.now() - t0), prompt: brief, reply: text,
                error: String(e.message || e) });
      return text;
    }
  }

  // 兜底：本地拟人模板
  const text = localTemplate(actor, phase);
  pushLog({ actor: actor.name, phase, mode: '本地模板', temp, ms: 0, prompt: '(未启用 API)', reply: text });
  return text;
}

/** 调试台"测试调用"按钮 */
async function testAI() {
  readCfgFromUI();
  const msgs = [{ role:'system', content:'用一句话回应，不超过 20 字。' },
                { role:'user',   content:'测试连通性' }];
  const own = !!(CONFIG.api.base_url && CONFIG.api.api_key);
  const t0 = performance.now();
  try {
    let text, mode, ms;
    if (own) {                                   // 填了就测直连
      text = sanitize(await callAI(msgs, CONFIG.api));
      mode = '自带Key'; ms = Math.round(performance.now() - t0);
    } else if (CONFIG.serverAI) {                // 没填就测服务端默认模型
      const r = await callServerAI(msgs, CONFIG.api.temperature, 60);
      text = sanitize(r.content); mode = '服务端'; ms = r.ms ?? Math.round(performance.now() - t0);
    } else {
      alert('当前无可用 API：离线打开或服务端未配置，游戏将使用本地拟人模板。');
      return;
    }
    pushLog({ actor:'(测试)', phase:'test', mode, temp:CONFIG.api.temperature, ms,
              prompt:'测试连通性', reply:text });
    alert(`调用成功（${mode}，${ms}ms）：` + text);
  } catch (e) {
    pushLog({ actor:'(测试)', phase:'test', mode:'失败', ms:Math.round(performance.now()-t0),
              prompt:'测试连通性', reply:'-', error:String(e.message||e) });
    alert('调用失败：' + (e.message || e));
  }
  updateApiState();
}
</script>
<script>
/* ============================================================
   STATE —— 全局对局状态
   ============================================================ */
const STATE = {
  phase: 'lobby', circle: 'tech', round: 0,
  players: [], me: null, post: null,
  comments: [],           // {id,authorId,author,avatar,text,parent,likes,dislikes,round,phase}
  marks: {},              // 我的私密标记 {playerId:'trust'|'suspect'}
  markCounts: {},         // 结算用：被标记可疑次数
  votes: {},              // 当前轮投票 {voterId:targetId}
  history: [],            // 复盘：每阶段快照
  logs: [], ratings: [],  // AI 调用日志 / 像人评分
  spectatorMsgs: [], replyTo: null,
  nightPicks: {}, timer: null, tick: null, ended: false, replay: false,
};

let CID = 0;
const uid = () => 'c' + (++CID);
const byId = (id) => STATE.players.find((p) => p.id === id);
const alive = () => STATE.players.filter((p) => p.alive);
const aliveAI = () => alive().filter((p) => p.role === 'ai');
const meAlive = () => STATE.me && STATE.me.alive;
const canAct = () => meAlive() && !STATE.replay;

/** 组建 5 席：我固定为真人，其余 4 席中随机 2 席为 AI 伪人 */
function buildPlayers() {
  const names = [], used = new Set();
  while (names.length < 5) {
    const n = pick(NICK_A) + pick(NICK_B);
    if (!used.has(n)) { used.add(n); names.push(n); }
  }
  const avs = [...AVATARS].sort(() => Math.random() - 0.5).slice(0, 5);
  const roles = ['human', 'human', 'ai', 'ai'].sort(() => Math.random() - 0.5); // 4 个 NPC
  const meSeat = Math.floor(Math.random() * 5);

  STATE.players = names.map((name, i) => ({
    id: 'p' + i, name, avatar: avs[i],
    role: i === meSeat ? 'human' : roles.pop(),
    alive: true, isMe: i === meSeat,
    said: 0, out: null,   // out: 'vote1'|'night'|'vote2'
  }));
  STATE.me = STATE.players[meSeat];
  STATE.me.name = document.getElementById('myName').textContent || STATE.me.name;
  STATE.me.avatar = document.getElementById('myAvatar').textContent.trim() || STATE.me.avatar;
  STATE.players.forEach((p) => { STATE.markCounts[p.id] = 0; });
}

/** 接口调用点：真实接入时替换为知乎热榜 / 搜索 API（见 references/http-api.md） */
async function fetchHotPost(circle) {
  // TODO(真实接入): GET https://developer.zhihu.com/api/v1/hot_list
  //   headers: Authorization: Bearer <Access Secret>, X-Request-Timestamp
  //   必须在服务端调用（凭证不进浏览器），前端改为 fetch('/api/hot')
  return MOCK_POSTS[circle] || MOCK_POSTS.tech;
}

/* ===================== 渲染 ===================== */

function renderPost() {
  const p = STATE.post; if (!p) return;
  document.getElementById('postCard').innerHTML = `
    <div class="flex items-center gap-2 mb-2 text-xs">
      <span class="chip" style="background:rgba(0,132,255,.16);border-color:rgba(0,132,255,.4)">
        ${CIRCLES.find((c) => c.id === STATE.circle)?.icon || ''} ${CIRCLES.find((c) => c.id === STATE.circle)?.name || ''}圈</span>
      <span class="opacity-45">热榜 · mock 数据</span>
    </div>
    <h2 class="text-lg font-bold leading-snug mb-2">${esc(p.title)}</h2>
    <p class="text-sm opacity-72 leading-relaxed mb-3">${esc(p.body)}</p>
    <div class="space-y-1.5 pt-3 border-t border-white/10">
      <div class="text-xs opacity-50 mb-1">高赞评论</div>
      ${p.hot.map((h) => `<div class="text-sm flex gap-2">
        <b class="opacity-60 shrink-0">${esc(h.n)}</b>
        <span class="opacity-80">${esc(h.t)}</span></div>`).join('')}
    </div>`;
}

function renderPlayers() {
  const box = document.getElementById('players');
  const show = CONFIG.showIdentity || STATE.ended || !meAlive();  // 出局者知道所有人身份
  box.innerHTML = STATE.players.map((p) => {
    const mk = STATE.marks[p.id];
    const tag = p.alive ? '' : `<span class="chip text-[10px] bg-red-500/20 border-red-400/30">已折叠</span>`;
    const idt = show ? `<span class="chip text-[10px] ${p.role === 'ai' ? 'bg-fuchsia-500/25 border-fuchsia-300/40' : 'bg-emerald-500/20 border-emerald-300/30'}">${p.role === 'ai' ? 'AI 伪人' : '真人'}</span>` : '';
    return `<div class="glass-b p-2.5 flex items-center gap-2.5 ${p.alive ? '' : 'dead'}">
      <span class="text-xl shrink-0">${p.avatar}</span>
      <div class="min-w-0 flex-1">
        <div class="text-sm font-medium truncate flex items-center gap-1.5">
          ${esc(p.name)} ${p.isMe ? '<span class="chip text-[10px] bg-sky-500/25 border-sky-300/40">你</span>' : ''}
        </div>
        <div class="flex gap-1 mt-0.5 flex-wrap">${tag}${idt}
          ${mk ? `<span class="chip text-[10px] ${mk === 'trust' ? 'bg-emerald-500/20' : 'bg-amber-500/20'}">${mk === 'trust' ? '可信' : '可疑'}</span>` : ''}
          <span class="chip text-[10px] opacity-50">${p.said} 条</span>
        </div>
      </div>
      ${STATE.phase === 'mark' && canAct() && !p.isMe && p.alive ? `
        <div class="flex flex-col gap-1 shrink-0">
          <button class="btn-g text-[10px] px-1.5 py-0.5" onclick="mark('${p.id}','trust')">可信</button>
          <button class="btn-g text-[10px] px-1.5 py-0.5" onclick="mark('${p.id}','suspect')">可疑</button>
        </div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('aliveCount').textContent = `${alive().length}/5 存活`;
}

function renderComments() {
  const box = document.getElementById('comments');
  const tops = STATE.comments.filter((c) => !c.parent);
  const node = (c, depth) => {
    const kids = STATE.comments.filter((k) => k.parent === c.id);
    const p = byId(c.authorId);
    return `<div class="${depth ? 'reply' : ''} fade-in">
      <div class="flex gap-2">
        <span class="text-lg shrink-0 ${p && !p.alive ? 'dead' : ''}">${c.avatar}</span>
        <div class="min-w-0 flex-1">
          <div class="text-xs opacity-55 flex items-center gap-1.5 flex-wrap">
            <b class="opacity-90">${esc(c.author)}</b>
            ${c.authorId === STATE.me?.id ? '<span class="chip text-[10px] bg-sky-500/25">你</span>' : ''}
            <span>· 第${c.round || '-'}轮</span>
          </div>
          <div class="text-sm mt-0.5 leading-relaxed">${esc(c.text)}</div>
          <div class="flex items-center gap-3 mt-1 text-xs opacity-55">
            <button class="hover:opacity-100" onclick="like('${c.id}',1)">▲ ${c.likes}</button>
            <button class="hover:opacity-100" onclick="like('${c.id}',-1)">▼ ${c.dislikes}</button>
            ${canAct() && ['discuss','final_discuss'].includes(STATE.phase)
              ? `<button class="hover:opacity-100 underline" onclick="setReply('${c.id}')">回复</button>` : ''}
            ${STATE.ended || !meAlive() ? rateBtns(c) : ''}
          </div>
          ${kids.map((k) => node(k, depth + 1)).join('')}
        </div>
      </div></div>`;
  };
  box.innerHTML = tops.length ? tops.map((c) => node(c, 0)).join('')
    : '<div class="text-sm opacity-40 py-6 text-center">还没有人发言</div>';
  box.scrollTop = box.scrollHeight;
  document.getElementById('cmtCount').textContent = `${STATE.comments.length} 条`;
}

/** 评分按钮：玩家对 AI 发言打「像人 / 不像人」，写入 logs */
function rateBtns(c) {
  const p = byId(c.authorId);
  if (!p || p.role !== 'ai') return '';
  const r = STATE.ratings.find((x) => x.commentId === c.id);
  if (r) return `<span class="chip text-[10px] ${r.human ? 'bg-emerald-500/20' : 'bg-red-500/20'}">${r.human ? '像人' : '不像人'}</span>`;
  return `<button class="hover:opacity-100 underline" onclick="rate('${c.id}',1)">像人</button>
          <button class="hover:opacity-100 underline" onclick="rate('${c.id}',0)">不像人</button>`;
}

function rate(cid, human) {
  const c = STATE.comments.find((x) => x.id === cid); if (!c) return;
  STATE.ratings.push({ commentId: cid, actor: c.author, text: c.text, human: !!human, at: Date.now() });
  pushLog({ actor: c.author, phase: 'rating', mode: '人工评分', prompt: c.text, reply: human ? '像人 👍' : '不像人 👎' });
  renderComments();
}

function like(cid, d) {
  const c = STATE.comments.find((x) => x.id === cid); if (!c || !canAct()) return;
  if (d > 0) c.likes++; else c.dislikes++;
  renderComments();
}

/** 发一条评论（真人或 NPC 共用） */
function addComment(actor, text, parent = null, phase = STATE.phase) {
  const c = { id: uid(), authorId: actor.id, author: actor.name, avatar: actor.avatar,
              text, parent, likes: 0, dislikes: 0, round: STATE.round, phase };
  STATE.comments.push(c); actor.said++;
  renderComments(); renderPlayers();
  return c;
}

const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
</script>
<script>
/* ============================================================
   阶段引擎：倒计时 + 刘看山全屏过渡 + 10 阶段状态机
   ============================================================ */
const PHASE_META = {
  post:          { name:'帖子加载', hint:'看清楼里在聊什么' },
  discuss:       { name:'讨论阶段', hint:'只聊热点，别聊 AI' },
  mark:          { name:'识别阶段', hint:'私密标记，不影响投票' },
  vote1:         { name:'第一轮投票', hint:'不能投自己' },
  defense:       { name:'最后辩解', hint:'辩解不保证真实' },
  night:         { name:'黑夜', hint:'伪人独立选择折叠对象' },
  final_discuss: { name:'终轮讨论', hint:'谁最可疑？' },
  vote2:         { name:'终投', hint:'最后一票' },
  settle:        { name:'结算', hint:'揭晓所有身份' },
  replay:        { name:'复盘模式', hint:'房间未关闭，可继续聊' },
};

/** 全屏过渡；resolve 后继续流程 */
function curtain(variant, title, sub = '', hold = 1750, mood = 'norm') {
  return new Promise((resolve) => {
    const c = document.getElementById('curtain');
    document.getElementById('ctArt').innerHTML = lks(variant, 170);
    document.getElementById('ctTitle').textContent = title;
    document.getElementById('ctSub').textContent = sub;
    c.className = mood + ' show';
    setTimeout(() => {
      c.classList.remove('show');
      setTimeout(resolve, 520);           // 等 opacity transition 收尾
    }, hold);
  });
}

/** 跑一个带倒计时的阶段 */
function runPhase(phase, secs, onEnd) {
  STATE.phase = phase;
  STATE.gen = (STATE.gen || 0) + 1;      // 阶段代际：让上一轮遗留的 NPC 发言循环自然退出
  const meta = PHASE_META[phase] || { name: phase, hint: '' };
  document.getElementById('phaseName').textContent =
    meta.name + (phase === 'discuss' ? ` 第${STATE.round}轮` : '');
  document.getElementById('phaseHint').textContent = meta.hint;
  document.getElementById('roundTag').textContent =
    phase === 'discuss' ? `第 ${STATE.round} / ${CONFIG.rounds} 轮` : meta.name;
  updateComposer(); renderPlayers();

  clearInterval(STATE.tick);
  let left = secs;
  const paint = () => {
    document.getElementById('clock').textContent =
      String(Math.floor(left / 60)) + ':' + String(left % 60).padStart(2, '0');
    document.getElementById('bar').style.width = (left / secs * 100) + '%';
  };
  paint();
  return new Promise((resolve) => {
    STATE.tick = setInterval(() => {
      left--; paint();
      if (left <= 0) {
        clearInterval(STATE.tick);
        snapshot(phase);
        resolve(onEnd ? onEnd() : undefined);
      }
    }, 1000);
  });
}

/** 复盘快照 */
function snapshot(phase) {
  STATE.history.push({
    phase, round: STATE.round,
    comments: STATE.comments.length,
    votes: { ...STATE.votes },
    alive: alive().map((p) => p.name),
  });
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const jitter = (a, b) => a + Math.random() * (b - a);

/** 让所有存活 NPC 依次发言（错开时间，像真人陆续冒出来） */
async function npcSpeak(phase, filterFn) {
  const gen = STATE.gen;                          // 绑定本轮代际
  const npcs = alive().filter((p) => !p.isMe && (!filterFn || filterFn(p)));
  npcs.sort(() => Math.random() - 0.5);
  for (const npc of npcs) {
    // 阶段切换或进入下一轮，立刻停止（避免上一轮发言溢到下一轮）
    if (STATE.phase !== phase || STATE.gen !== gen) return;
    await sleep(jitter(900, 2600));
    if (STATE.phase !== phase || STATE.gen !== gen) return;
    const text = await speak(npc, phase);
    if (STATE.phase !== phase || STATE.gen !== gen) return;
    // 有一定概率作为楼中楼回复挂在别人评论下
    const cands = STATE.comments.filter((c) => !c.parent && c.authorId !== npc.id);
    const parent = (cands.length && Math.random() < 0.4) ? pick(cands).id : null;
    addComment(npc, text, parent, phase);
  }
}

/* ===================== 主流程 ===================== */
async function startGame() {
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  buildPlayers();
  STATE.post = await fetchHotPost(STATE.circle);
  renderPost(); renderPlayers(); renderComments();

  // 2. 帖子加载 20s
  await runPhase('post', CONFIG.durations.post);

  // 3. 讨论 2 轮 × 90s
  await curtain('discuss', '开始讨论', '只聊热点，别聊 AI', 1900);
  for (let r = 1; r <= CONFIG.rounds; r++) {
    STATE.round = r;
    npcSpeak('discuss');                          // 不 await：与倒计时并行
    await runPhase('discuss', CONFIG.durations.discuss);
  }

  // 4. 识别 60s
  await curtain('hunt', '现在开始找 AI', '标记是私密的，不影响投票', 1900);
  await runPhase('mark', CONFIG.durations.mark, () => { npcMark(); });

  // 5. 第一轮投票 30s
  await curtain('vote', '投票折叠', '存活者各 1 票，不能投自己', 1750);
  await runPhase('vote1', CONFIG.durations.vote1);
  const out1 = tallyVotes('vote1');

  // 出局者辩解 30s
  if (out1) {
    await runPhase('defense', CONFIG.durations.defense, null);
  }

  if (checkEnd()) return;

  // 6. 黑夜 20s
  await curtain('night', '天黑请闭眼', '伪人独立选择，互不知情', 2100, 'night');
  await runPhase('night', CONFIG.durations.night, () => resolveNight());
  await curtain('day', '天亮了', STATE.nightMsg || '', 1900, 'day');
  if (STATE.nightMsg) toast(STATE.nightMsg);

  if (checkEnd()) return;

  // 7. 终轮讨论 45s
  STATE.round = 3;
  npcSpeak('final_discuss');
  await runPhase('final_discuss', CONFIG.durations.final_discuss);

  // 8. 终投 30s
  await curtain('vote', '最后一票', '最高票出局', 1650);
  await runPhase('vote2', CONFIG.durations.vote2);
  tallyVotes('vote2');

  // 9. 结算
  finish();
}

/** 计票：最高票出局，平票随机；返回出局者 */
function tallyVotes(phase) {
  // 补齐未投票的 NPC
  alive().forEach((p) => { if (!p.isMe && !STATE.votes[p.id]) STATE.votes[p.id] = npcVote(p); });

  const cnt = {};
  Object.values(STATE.votes).forEach((t) => { if (t) cnt[t] = (cnt[t] || 0) + 1; });
  const max = Math.max(0, ...Object.values(cnt));
  if (!max) { STATE.votes = {}; return null; }

  const top = Object.keys(cnt).filter((k) => cnt[k] === max);
  const outId = pick(top);
  const out = byId(outId);
  out.alive = false; out.out = phase;
  STATE.lastOut = out;                            // 供辩解阶段判断是否是我自己

  STATE.voteLog = STATE.voteLog || [];
  STATE.voteLog.push({ phase, votes: { ...STATE.votes }, out: out.name, role: out.role, tie: top.length > 1 });

  showReveal(out, phase, cnt);
  STATE.votes = {};
  renderPlayers(); renderComments(); updateComposer(); updateSpectator();
  return out;
}

/** NPC 投票倾向：AI 优先投票给"标记自己可疑"或发言最像人类侦探的；真人投可疑的 */
function npcVote(p) {
  const cands = alive().filter((x) => x.id !== p.id);
  if (!cands.length) return null;
  const score = cands.map((c) => {
    let s = Math.random() * 2;
    if (p.role === 'ai') {
      s += (STATE.markCounts[c.id] || 0) * 0.3;          // 被公认可疑的，顺水推舟
      if (c.role === 'ai') s -= 1.1;                      // 弱直觉：说话方式相近，略回避
      if (c.isMe) s += 0.9;                               // 真人玩家威胁最大
    } else {
      s += (STATE.markCounts[c.id] || 0) * 0.85;
      if (c.role === 'ai') s += 0.7;                       // 真人有一定判断力
    }
    return { id: c.id, s };
  }).sort((a, b) => b.s - a.s);
  return score[0].id;
}

/** NPC 私密标记（只影响 markCounts，用于结算展示与投票倾向） */
function npcMark() {
  alive().filter((p) => !p.isMe).forEach((p) => {
    const t = pick(alive().filter((x) => x.id !== p.id));
    if (t && Math.random() < 0.75) STATE.markCounts[t.id] = (STATE.markCounts[t.id] || 0) + 1;
  });
}

/**
 * 黑夜判定：
 *   2 AI 存活 + 同一目标 -> 出局
 *   2 AI 存活 + 不同目标 -> 无人出局
 *   1 AI 存活           -> 直接生效
 */
function resolveNight() {
  const ais = aliveAI();
  STATE.nightMsg = '';
  if (!ais.length) return;

  ais.forEach((ai) => {
    if (ai.isMe) return;                                   // 我是 AI 时用面板选择
    const cands = alive().filter((x) => x.id !== ai.id);
    if (cands.length) STATE.nightPicks[ai.id] = pick(cands).id;
  });

  const picks = ais.map((a) => STATE.nightPicks[a.id]).filter(Boolean);
  if (ais.length >= 2) {
    if (picks.length === 2 && picks[0] === picks[1]) {
      const v = byId(picks[0]); v.alive = false; v.out = 'night';
      STATE.nightMsg = `${v.name} 被折叠了`;
      showReveal(v, 'night', null);
    } else {
      STATE.nightMsg = '昨夜平安无事 —— 两个伪人选了不同的人';
    }
  } else if (picks.length === 1) {
    const v = byId(picks[0]); v.alive = false; v.out = 'night';
    STATE.nightMsg = `${v.name} 被折叠了`;
    showReveal(v, 'night', null);
  }
  STATE.nightPicks = {};
  renderPlayers(); updateComposer(); updateSpectator();
}

/** 提前结束判定：AI 全灭立刻结束 */
function checkEnd() {
  if (aliveAI().length === 0) { finish(); return true; }
  if (alive().length <= 2) { finish(); return true; }
  return false;
}

function toast(msg) {
  const d = document.createElement('div');
  d.className = 'fixed left-1/2 -translate-x-1/2 top-20 z-[70] glass px-4 py-2 text-sm fade-in';
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
</script>
<script>
/* ============================================================
   交互层：发言 / 标记 / 投票 / 黑夜选择 / 观战
   ============================================================ */

/** 输入框可用性随阶段与存活状态变化 */
function updateComposer() {
  const box = document.getElementById('composer');
  const tip = document.getElementById('composerTip');
  const canTalk = ['discuss', 'final_discuss'].includes(STATE.phase) || STATE.replay;
  // 我自己刚被投出局时，允许在辩解阶段发言（辩解不保证真实）
  const myDefense = STATE.phase === 'defense' && STATE.lastOut && STATE.lastOut.isMe;
  const ok = ((canAct() || STATE.replay) && canTalk) || myDefense;

  box.style.display = ok ? '' : 'none';
  document.getElementById('input').disabled = !ok;
  document.getElementById('sendBtn').disabled = !ok;

  if (STATE.phase === 'discuss') {
    const mine = STATE.comments.filter((c) => c.authorId === STATE.me?.id && c.round === STATE.round).length;
    tip.textContent = mine ? `本轮你已发 ${mine} 条` : '本轮每人至少发 1 条';
  } else if (STATE.replay) {
    tip.textContent = '复盘模式 · 房间未关闭，可以继续聊';
  } else tip.textContent = '';

  renderActionPanel();
}

function setReply(cid) {
  const c = STATE.comments.find((x) => x.id === cid); if (!c) return;
  STATE.replyTo = cid;
  document.getElementById('replyTo').classList.remove('hidden');
  document.getElementById('replyToName').textContent = c.author;
  document.getElementById('input').focus();
}
function clearReply() {
  STATE.replyTo = null;
  document.getElementById('replyTo').classList.add('hidden');
}

function sendMine() {
  const el = document.getElementById('input');
  const text = el.value.trim();
  if (!text) return;
  if (!canAct() && !STATE.replay) return;
  addComment(STATE.me, text, STATE.replyTo, STATE.phase);
  el.value = ''; clearReply(); updateComposer();
}

/** 私密标记：只写入我自己的视图 + 结算统计 */
function mark(pid, kind) {
  if (!canAct() || STATE.phase !== 'mark') return;
  if (STATE.marks[pid] === kind) delete STATE.marks[pid];
  else {
    STATE.marks[pid] = kind;
    if (kind === 'suspect') STATE.markCounts[pid] = (STATE.markCounts[pid] || 0) + 1;
  }
  renderPlayers();
}

/** 右侧面板：投票 / 黑夜 / 识别 提示 */
function renderActionPanel() {
  const box = document.getElementById('actionPanel');
  const ph = STATE.phase;
  const iAmAliveAI = meAlive() && STATE.me.role === 'ai';

  // 黑夜：只有存活的 AI 有面板，且看不到同伴选择
  if (ph === 'night') {
    if (!iAmAliveAI) {
      box.classList.remove('hidden');
      box.innerHTML = `<h3 class="font-semibold text-sm mb-1">天黑请闭眼</h3>
        <p class="text-xs opacity-60">等待伪人行动…</p>`;
      return;
    }
    const picked = STATE.nightPicks[STATE.me.id];
    box.classList.remove('hidden');
    box.innerHTML = `<h3 class="font-semibold text-sm mb-1">选择折叠对象</h3>
      <p class="text-xs opacity-55 mb-2.5">你看不到另一个伪人的选择。只有两人选中同一人才会生效。</p>
      <div class="space-y-1.5">${alive().filter((p) => p.id !== STATE.me.id).map((p) => `
        <button class="w-full text-left glass-b p-2 text-sm hover:bg-white/10 ${picked === p.id ? 'ring-2 ring-fuchsia-400' : ''}"
          onclick="nightPick('${p.id}')">${p.avatar} ${esc(p.name)}</button>`).join('')}</div>`;
    return;
  }

  // 投票
  if (ph === 'vote1' || ph === 'vote2') {
    box.classList.remove('hidden');
    if (!meAlive()) {
      box.innerHTML = `<h3 class="font-semibold text-sm mb-1">投票进行中</h3>
        <p class="text-xs opacity-60">你已出局，只能观战。</p>`;
      return;
    }
    const my = STATE.votes[STATE.me.id];
    box.innerHTML = `<h3 class="font-semibold text-sm mb-1">${ph === 'vote2' ? '终投' : '投票折叠'}</h3>
      <p class="text-xs opacity-55 mb-2.5">不能投自己。最高票出局。</p>
      <div class="space-y-1.5">${alive().filter((p) => p.id !== STATE.me.id).map((p) => `
        <button class="w-full text-left glass-b p-2 text-sm hover:bg-white/10 ${my === p.id ? 'ring-2 ring-sky-400' : ''}"
          onclick="castVote('${p.id}')">${p.avatar} ${esc(p.name)}
          ${my === p.id ? '<span class="chip text-[10px] ml-1 bg-sky-500/25">已投</span>' : ''}</button>`).join('')}</div>`;
    return;
  }

  if (ph === 'mark') {
    box.classList.remove('hidden');
    box.innerHTML = `<h3 class="font-semibold text-sm mb-1">识别阶段</h3>
      <p class="text-xs opacity-55">在左侧玩家卡上标记「可信 / 可疑」。标记只有你能看到，不影响投票结果。</p>`;
    return;
  }

  if (ph === 'defense') {
    box.classList.remove('hidden');
    box.innerHTML = `<h3 class="font-semibold text-sm mb-1">最后辩解</h3>
      <p class="text-xs opacity-55">出局者的辩解不保证真实。</p>`;
    return;
  }
  box.classList.add('hidden');
}

function nightPick(pid) {
  if (STATE.phase !== 'night' || !meAlive() || STATE.me.role !== 'ai') return;
  STATE.nightPicks[STATE.me.id] = pid;
  renderActionPanel();
}

function castVote(pid) {
  if (!['vote1', 'vote2'].includes(STATE.phase) || !meAlive()) return;
  STATE.votes[STATE.me.id] = pid;
  renderActionPanel();
}

/** 出局揭晓 + 最后辩解 */
function showReveal(p, phase, cnt) {
  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  const why = phase === 'night' ? '被伪人折叠' : '被投票折叠';
  box.innerHTML = `<h3 class="font-semibold text-sm mb-2">身份揭晓</h3>
    <div class="glass-b p-3">
      <div class="flex items-center gap-2 mb-1.5">
        <span class="text-2xl">${p.avatar}</span>
        <div><b>${esc(p.name)}</b>
          <div class="text-xs opacity-60">${why}</div></div>
      </div>
      <div class="chip ${p.role === 'ai' ? 'bg-fuchsia-500/25 border-fuchsia-300/40' : 'bg-emerald-500/20 border-emerald-300/30'}">
        身份：${p.role === 'ai' ? 'AI 伪人' : '真人人类'}</div>
      ${cnt ? `<div class="text-xs opacity-55 mt-2">得票 ${cnt[p.id] || 0} 票</div>` : ''}
    </div>`;

  // 出局者辩解：NPC 由 AI/模板生成；我自己出局则用输入框
  if (phase !== 'night' && !p.isMe) {
    speak(p, 'defense').then((t) => {
      if (t) addComment(p, '【最后辩解】' + t, null, 'defense');
    });
  }
  updateSpectator();
}

/** 观战模式切换 */
function updateSpectator() {
  const out = STATE.me && !STATE.me.alive;
  document.getElementById('specBar').classList.toggle('hidden', !out || STATE.ended);
  document.getElementById('specChat').classList.toggle('hidden', !out);
  if (out) renderSpecMsgs();
  renderPlayers();
}

function renderSpecMsgs() {
  const box = document.getElementById('specMsgs');
  const dead = STATE.players.filter((p) => !p.alive && !p.isMe);
  box.innerHTML = STATE.spectatorMsgs.length
    ? STATE.spectatorMsgs.map((m) => `<div><b class="opacity-70">${esc(m.who)}</b>
        <span class="opacity-85">${esc(m.text)}</span></div>`).join('')
    : `<div class="opacity-45 text-xs">观战席只有你${dead.length ? ' 和 ' + dead.map((d) => d.name).join('、') : ''}。存活玩家看不到这里。</div>`;
  box.scrollTop = box.scrollHeight;
}

function sendSpec() {
  const el = document.getElementById('specInput');
  const t = el.value.trim(); if (!t) return;
  STATE.spectatorMsgs.push({ who: STATE.me.name + '(你)', text: t });
  el.value = '';
  // 其他观战者偶尔回一句
  const others = STATE.players.filter((p) => !p.alive && !p.isMe);
  if (others.length && Math.random() < 0.65) {
    setTimeout(() => {
      const o = pick(others);
      STATE.spectatorMsgs.push({ who: o.name, text: pick(['我早说了。','里面那俩还在演。','看他们投错人真上火。','安静看戏吧。']) });
      renderSpecMsgs();
    }, jitter(700, 1800));
  }
  renderSpecMsgs();
}
</script>
<script>
/* ============================================================
   结算 + 复盘模式
   胜负：终局 2 AI 存活 = 伪人完胜；1 AI = 平局；0 AI = 人类胜
   ============================================================ */
function finish() {
  clearInterval(STATE.tick);
  STATE.ended = true;
  const n = aliveAI().length;
  const outcome = n >= 2 ? { key:'lose', title:'伪人完胜', sub:'两个 AI 活到了最后',
                             color:'text-fuchsia-300', art:'lose' }
                : n === 1 ? { key:'draw', title:'平局', sub:'还剩一个伪人潜在楼里',
                             color:'text-amber-300', art:'draw' }
                          : { key:'win',  title:'人类胜', sub:'两个伪人都被折叠了',
                             color:'text-emerald-300', art:'win' };
  STATE.outcome = outcome;

  curtain(outcome.art, '本局结束', outcome.title, 2400).then(() => {
    document.getElementById('game').classList.add('hidden');
    renderResult(outcome);
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('phaseName').textContent = '结算';
    document.getElementById('phaseHint').textContent = outcome.title;
    document.getElementById('clock').textContent = '--';
    document.getElementById('bar').style.width = '100%';
    document.getElementById('specBar').classList.add('hidden');
    // 结算展示 20s 后自动进入复盘模式（房间不关闭）
    setTimeout(enterReplay, CONFIG.durations.settle * 1000);
  });
}

/** 每个人的投票命中情况：投中 AI 记一次命中 */
function voteHits(pid) {
  let hit = 0, total = 0;
  (STATE.voteLog || []).forEach((v) => {
    const t = v.votes[pid];
    if (!t) return;
    total++;
    if (byId(t)?.role === 'ai') hit++;
  });
  return { hit, total };
}

function renderResult(outcome) {
  const box = document.getElementById('result');
  const rows = STATE.players.map((p) => {
    const said = STATE.comments.filter((c) => c.authorId === p.id);
    const vh = voteHits(p.id);
    const outTxt = p.alive ? '存活' :
      ({ vote1:'首轮被投出', night:'黑夜被折叠', vote2:'终投被投出' }[p.out] || '出局');
    return `<div class="glass-b p-3">
      <div class="flex items-center gap-2 flex-wrap mb-1.5">
        <span class="text-xl">${p.avatar}</span>
        <b>${esc(p.name)}</b>
        ${p.isMe ? '<span class="chip text-[10px] bg-sky-500/25 border-sky-300/40">你</span>' : ''}
        <span class="chip text-[10px] ${p.role === 'ai' ? 'bg-fuchsia-500/25 border-fuchsia-300/40' : 'bg-emerald-500/20 border-emerald-300/30'}">
          ${p.role === 'ai' ? 'AI 伪人' : '真人'}</span>
        <span class="chip text-[10px] opacity-60">${outTxt}</span>
      </div>
      <div class="flex gap-4 text-xs opacity-65 mb-2 flex-wrap">
        <span>发言 ${said.length} 条</span>
        <span>被标记可疑 ${STATE.markCounts[p.id] || 0} 次</span>
        <span>投票命中 AI ${vh.hit}/${vh.total}</span>
      </div>
      <div class="space-y-1 text-sm">
        ${said.length ? said.map((c) => `<div class="opacity-80">· ${esc(c.text)}</div>`).join('')
                      : '<div class="opacity-40 text-xs">全程没说话</div>'}
      </div>
    </div>`;
  }).join('');

  const ratings = STATE.ratings.length
    ? `<div class="glass-b p-3 mt-3">
        <div class="text-sm font-semibold mb-1.5">AI 发言评分</div>
        <div class="text-xs opacity-70">共 ${STATE.ratings.length} 条评分 ·
          像人 ${STATE.ratings.filter((r) => r.human).length} ·
          不像人 ${STATE.ratings.filter((r) => !r.human).length}
          （数据已写入 logs，可在调试台导出）</div></div>` : '';

  box.innerHTML = `
    <div class="text-center mb-5">
      <div class="flex justify-center mb-1">${lks(outcome.art, 130)}</div>
      <h2 class="text-2xl font-bold ${outcome.color}">${outcome.title}</h2>
      <p class="text-sm opacity-60 mt-1">${outcome.sub} · 终局存活伪人 ${aliveAI().length} 个</p>
    </div>
    <div class="grid md:grid-cols-2 gap-3">${rows}</div>
    ${ratings}
    <div class="flex gap-2.5 justify-center mt-5 flex-wrap">
      <button class="btn px-5 py-2.5" onclick="restart()">再来一局</button>
      <button class="btn-g px-4 py-2.5 text-sm" onclick="enterReplay()">进入复盘模式</button>
      <button class="btn-g px-4 py-2.5 text-sm" onclick="exportLogs()">导出本局日志</button>
    </div>`;
}

/** 复盘模式：房间不关闭，可回看全部记录、继续聊天 */
function enterReplay() {
  if (STATE.replay) return;
  STATE.replay = true;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('specChat').classList.add('hidden');
  STATE.phase = 'replay';
  document.getElementById('phaseName').textContent = '复盘模式';
  document.getElementById('phaseHint').textContent = '房间未关闭 · 可回看记录并继续聊';
  document.getElementById('clock').textContent = '∞';

  const box = document.getElementById('revealBox');
  box.classList.remove('hidden');
  box.innerHTML = `<h3 class="font-semibold text-sm mb-2">本局流程回看</h3>
    <div class="space-y-1 text-xs opacity-75 max-h-52 overflow-y-auto">
      ${STATE.history.map((h) => `<div>· ${PHASE_META[h.phase]?.name || h.phase}
        ${h.phase === 'discuss' ? '第' + h.round + '轮' : ''} —— 累计 ${h.comments} 条发言，存活 ${h.alive.length} 人</div>`).join('')}
      ${(STATE.voteLog || []).map((v) => `<div>· ${PHASE_META[v.phase]?.name || v.phase}：${esc(v.out)} 出局（${v.role === 'ai' ? 'AI 伪人' : '真人'}）${v.tie ? ' · 平票随机' : ''}</div>`).join('')}
    </div>
    <button class="btn w-full mt-3 py-2 text-sm" onclick="restart()">再来一局</button>`;

  renderPlayers(); renderComments(); updateComposer();
  toast('复盘模式：所有身份已公开，可继续聊天');
}

/** 再来一局：重置对局态，保留调试配置与日志 */
function restart() {
  clearInterval(STATE.tick);
  Object.assign(STATE, {
    phase:'lobby', round:0, players:[], me:null, post:null, comments:[],
    marks:{}, markCounts:{}, votes:{}, history:[], voteLog:[],
    spectatorMsgs:[], replyTo:null, nightPicks:{}, nightMsg:'', lastOut:null,
    ended:false, replay:false, ratings:[],
  });
  CID = 0;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('revealBox').classList.add('hidden');
  document.getElementById('actionPanel').classList.add('hidden');
  document.getElementById('specBar').classList.add('hidden');
  document.getElementById('specChat').classList.add('hidden');
  document.getElementById('lobby').classList.remove('hidden');
  document.getElementById('phaseName').textContent = '准备中';
  document.getElementById('phaseHint').textContent = '选择你的圈子';
  document.getElementById('clock').textContent = '--';
  document.getElementById('bar').style.width = '100%';
  rollIdentity();
}
</script>
<script>
/* ============================================================
   入场 UI / 调试台读写 / 日志 / 知乎 OAuth 前端 / 启动
   ============================================================ */

/* ---------- 入场：圈子选择 + 系统分配昵称 ---------- */
function renderCircles() {
  document.getElementById('circles').innerHTML = CIRCLES.map((c) => `
    <button class="glass-b p-3 text-center hover:bg-white/10 transition ${STATE.circle === c.id ? 'ring-2 ring-sky-400' : ''}"
      onclick="pickCircle('${c.id}')" aria-pressed="${STATE.circle === c.id}">
      <div class="text-2xl mb-1">${c.icon}</div>
      <div class="text-sm font-medium">${c.name}</div>
    </button>`).join('');
}
function pickCircle(id) {
  STATE.circle = id;
  const c = CIRCLES.find((x) => x.id === id);
  if (c) { CONFIG.persona = c.persona; document.getElementById('cfgPersona').value = c.persona; }
  renderCircles();
  document.getElementById('lobbyTip').textContent = `AI 人格已切到「${(PERSONAS[CONFIG.persona] || {}).label || ''}」`;
}
/** 匿名头像 + 系统分配昵称 */
function rollIdentity() {
  document.getElementById('myName').textContent = pick(NICK_A) + pick(NICK_B);
  document.getElementById('myAvatar').textContent = pick(AVATARS);
}

/* ---------- 调试台：配置读写 ---------- */
function applyPreset(k) {
  const p = PRESETS[k]; if (!p) return;
  CONFIG.api.preset = k;
  if (p.base_url) document.getElementById('cfgBase').value = p.base_url;
  if (p.model) document.getElementById('cfgModel').value = p.model;
  saveCfg();
}
function readCfgFromUI() {
  CONFIG.api.base_url    = document.getElementById('cfgBase').value.trim();
  CONFIG.api.api_key     = document.getElementById('cfgKey').value.trim();
  CONFIG.api.model       = document.getElementById('cfgModel').value.trim();
  CONFIG.api.temperature = parseFloat(document.getElementById('cfgTemp').value) || 0.85;
  CONFIG.api.max_tokens  = parseInt(document.getElementById('cfgMax').value, 10) || 110;
  CONFIG.api.preset      = document.getElementById('cfgPreset').value;
  CONFIG.persona         = document.getElementById('cfgPersona').value;
  CONFIG.prompt          = document.getElementById('cfgPrompt').value;
  CONFIG.showIdentity    = document.getElementById('cfgShowId').checked;
  CONFIG.logging         = document.getElementById('cfgLog').checked;
}
function writeCfgToUI() {
  document.getElementById('cfgBase').value    = CONFIG.api.base_url;
  document.getElementById('cfgKey').value     = CONFIG.api.api_key;
  document.getElementById('cfgModel').value   = CONFIG.api.model;
  document.getElementById('cfgTemp').value    = CONFIG.api.temperature;
  document.getElementById('cfgMax').value     = CONFIG.api.max_tokens;
  document.getElementById('cfgPreset').value  = CONFIG.api.preset;
  document.getElementById('cfgPersona').value = CONFIG.persona;
  document.getElementById('cfgPrompt').value  = CONFIG.prompt;
  document.getElementById('cfgShowId').checked = CONFIG.showIdentity;
  document.getElementById('cfgLog').checked    = CONFIG.logging;
}
/** api_key 只落本机 localStorage，不上传、不进仓库 */
function saveCfg() {
  readCfgFromUI();
  try { localStorage.setItem('fog_cfg', JSON.stringify({ api: CONFIG.api, prompt: CONFIG.prompt,
        persona: CONFIG.persona, showIdentity: CONFIG.showIdentity, logging: CONFIG.logging })); } catch (e) {}
  updateApiState();
}
function loadCfg() {
  try {
    const s = JSON.parse(localStorage.getItem('fog_cfg') || 'null');
    if (s) Object.assign(CONFIG, { ...CONFIG, ...s, api: { ...CONFIG.api, ...(s.api || {}) } });
  } catch (e) {}
}
/** 三种模式：自带Key（直连） > 服务端默认模型 > 本地拟人模板 */
function updateApiState() {
  const own = !!(CONFIG.api.base_url && CONFIG.api.api_key);
  const el = document.getElementById('apiState');
  if (own)                 { el.textContent = '自带 Key'; el.style.background = 'rgba(16,185,129,.22)'; }
  else if (CONFIG.serverAI){ el.textContent = '服务端默认模型'; el.style.background = 'rgba(0,132,255,.22)'; }
  else                     { el.textContent = '本地模板'; el.style.background = ''; }
}
function resetPrompt() {
  CONFIG.prompt = DEFAULT_PROMPT;
  document.getElementById('cfgPrompt').value = DEFAULT_PROMPT;
  saveCfg();
}
/** 导出配置：api_key 置空，避免密钥外泄 */
function exportCfg() {
  readCfgFromUI();
  const out = { config: { ...CONFIG, api: { ...CONFIG.api, api_key: '' } },
                personas: PERSONAS, exported_at: new Date().toISOString() };
  dl('fog-config.json', JSON.stringify(out, null, 2));
  toast('已导出（api_key 已自动清空）');
}
function importCfg(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const c = j.config || j;
      if (c.api) Object.assign(CONFIG.api, c.api);
      if (c.prompt) CONFIG.prompt = c.prompt;
      if (c.persona) CONFIG.persona = c.persona;
      if (c.temps) Object.assign(CONFIG.temps, c.temps);
      writeCfgToUI(); saveCfg(); toast('配置已导入');
    } catch (e) { alert('导入失败：' + e.message); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

/* ---------- 日志 ---------- */
function renderLogs() {
  const box = document.getElementById('logs');
  document.getElementById('logCount').textContent = STATE.logs.length;
  box.innerHTML = STATE.logs.slice().reverse().map((l) => `
    <div class="glass-b p-1.5 leading-snug">
      <div class="flex gap-1.5 flex-wrap items-center">
        <span class="opacity-45">${l.t}</span>
        <b class="text-sky-300">${esc(l.actor)}</b>
        <span class="chip text-[10px] opacity-70">${esc(l.phase)}</span>
        <span class="chip text-[10px] ${l.mode === 'API' ? 'bg-emerald-500/20' : l.mode === '降级' || l.mode === '失败' ? 'bg-red-500/20' : 'opacity-60'}">${esc(l.mode)}</span>
        ${l.temp != null ? `<span class="opacity-45">T=${l.temp}</span>` : ''}
        ${l.ms ? `<span class="opacity-45">${l.ms}ms</span>` : ''}
      </div>
      <div class="opacity-50 mt-0.5 truncate">prompt: ${esc(l.prompt || '')}</div>
      <div class="opacity-90">→ ${esc(l.reply || '')}</div>
      ${l.error ? `<div class="text-red-300 opacity-80">err: ${esc(l.error)}</div>` : ''}
    </div>`).join('');
}
function exportLogs() {
  dl('fog-logs.json', JSON.stringify({
    logs: STATE.logs, ratings: STATE.ratings, history: STATE.history,
    voteLog: STATE.voteLog || [], outcome: STATE.outcome || null,
    config: { ...CONFIG, api: { ...CONFIG.api, api_key: '' } },
  }, null, 2));
}
function dl(name, text) {
  const b = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 知乎 OAuth 前端 ----------
   浏览器只跟自己的后端打交道；app_key 与 access_token 全程留在服务端。
   后端路由见 functions/api/oauth/*.js
   本地 file:// 打开时无后端，按钮会提示不可用（游戏本体不受影响）。 */
function zhLogin() { location.href = '/api/oauth/start'; }

async function zhLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  renderAuth({ login: false });
}

async function checkAuth() {
  // 显示回调带回的登录错误
  const q = new URLSearchParams(location.search);
  if (q.get('login_error')) {
    const el = document.getElementById('loginErr');
    el.textContent = '登录失败：' + q.get('login_error');
    el.classList.remove('hidden');
  }
  // 离线 file:// 无后端：关掉服务端 AI，直接用本地模板
  if (location.protocol === 'file:') {
    CONFIG.serverAI = false; updateApiState();
    renderAuth({ login: false, local: true });
    return;
  }
  try {
    const r = await fetch('/api/me', { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('no backend');
    const s = await r.json();
    CONFIG.serverAI = s.llm_ready !== false;     // 服务端没配 key 就别白跑一趟
    updateApiState();
    renderAuth(s);
  } catch (e) {
    CONFIG.serverAI = false; updateApiState();    // 静态托管无 Function，降级
    renderAuth({ login: false, local: true });
  }
}

function renderAuth(s) {
  const box = document.getElementById('authBox');
  if (s.login && s.user) {
    const u = s.user;
    box.innerHTML = `<div class="flex items-center gap-2">
      <img src="${esc(u.avatar_path)}" alt="" class="w-7 h-7 rounded-full bg-white/10 object-cover"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'w-7 h-7 rounded-full bg-white/10 grid place-items-center text-xs',textContent:'知'}))">
      <span class="text-xs max-w-[92px] truncate" title="${esc(u.fullname)}">${esc(u.fullname)}</span>
      <button class="btn-g text-xs px-2 py-1" onclick="zhLogout()">退出</button>
    </div>`;
    return;
  }
  const tip = s.local ? '（需部署到云端后可用）' : '';
  box.innerHTML = `<button class="btn-g text-xs px-3 py-1.5" onclick="zhLogin()"
      ${s.local ? 'title="本地打开无后端，部署后可用"' : ''}>知乎账号登录${tip}</button>`;
}

/* ---------- 启动 ---------- */
(function init() {
  document.getElementById('cfgPreset').innerHTML =
    Object.keys(PRESETS).map((k) => `<option value="${k}">${k}</option>`).join('');
  document.getElementById('cfgPersona').innerHTML =
    Object.entries(PERSONAS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  document.getElementById('logoBox').innerHTML = lks('logo', 30);

  loadCfg(); writeCfgToUI(); updateApiState();
  renderCircles(); rollIdentity(); renderLogs();
  document.getElementById('drawer').addEventListener('transitionend', function () {
    const closed = this.classList.contains('closed');
    this.querySelector('button').setAttribute('aria-expanded', String(!closed));
  });
  checkAuth();
})();
</script>
</body>
</html>
