<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{background:radial-gradient(ellipse at 30% 12%,#1e3454 0%,#0b1016 70%);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  display:flex;align-items:center;justify-content:center;position:relative}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(0,132,255,.16)}
.r1{width:880px;height:880px}
.r2{width:660px;height:660px;border-color:rgba(0,132,255,.1)}
.glow{position:absolute;width:640px;height:640px;border-radius:50%;
  background:rgba(0,132,255,.24);filter:blur(120px);top:60px}
.stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.stack img{display:block;filter:drop-shadow(0 26px 54px rgba(0,0,0,.7))}
/* 迷雾条：象征评论区里辨不清的发言。压在角色脚下、标题之上 */
.fog{position:absolute;top:625px;display:flex;flex-direction:column;gap:15px;align-items:center;opacity:.42}
.fog i{display:block;height:14px;border-radius:8px;
  background:linear-gradient(90deg,rgba(0,132,255,0),rgba(0,132,255,.9),rgba(0,132,255,0))}
.title{position:relative;font-size:150px;font-weight:900;letter-spacing:10px;
  background:linear-gradient(180deg,#fff 34%,#7cc0ff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;line-height:1;
  filter:drop-shadow(0 6px 30px rgba(0,0,0,.8))}
/* 问号贴在刘看山头侧，形成"看不清是谁"的读法 */
.q{position:absolute;font-size:150px;font-weight:900;color:#e85aff;
  text-shadow:0 0 54px rgba(232,90,255,.95);right:150px;top:205px;transform:rotate(13deg)}
</style></head><body>
<div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div>
<div class="fog">
  <i style="width:330px"></i><i style="width:430px"></i>
  <i style="width:250px"></i><i style="width:380px"></i>
</div>
<div class="q">?</div>
<div class="stack">
  <!-- 知乎官方刘看山 3D 素材（打招呼动图抽帧） -->
  <img src="frame-wave.png" width="470" height="470" alt="刘看山">
  <div class="title">迷雾</div>
</div>
</body></html>
